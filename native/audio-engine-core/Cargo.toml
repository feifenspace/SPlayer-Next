[package]
name = "audio-engine-core"
version = "0.1.0"
edition = "2021"
description = "Platform-independent audio engine core shared by native bindings and the Linux headless server."

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# 音频解码 & 播放
ffmpeg_audio = { version = "0.3.1", default-features = false, features = [
  "http",
  "tracing",
] }
libc = "0.2"
parking_lot = "0.12"
diretta-sys = { path = "../diretta-sys" }

# 错误处理
anyhow = { workspace = true }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
once_cell = "1"

# DSP
signalsmith-stretch = "0.1.3"
rustfft = { version = "6", optional = true }

# 元数据 & 缩略图
lofty = "0.24"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "bmp",
  "webp",
] }

# 文件遍历 & 文本编码识别
walkdir = "2"
encoding_rs = "0.8"
chardetng = "0.1"
rustysynth = { version = "1.3", optional = true }

# 日志（纯 Rust，无 NAPI）
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
time = { workspace = true }

# 音频输出（cpal 统一后端：Linux PipeWire/PulseAudio、macOS CoreAudio、Windows WASAPI）
cpal = { version = "0.18.2", default-features = false, features = [
  "pipewire",
  "pulseaudio",
] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10.0", features = ["v0_3_53"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3.2", default-features = false, features = [
  "std",
  "AudioHardware",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = { workspace = true }
[target.'cfg(target_os = "windows")'.dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Threading",
]

[features]
default = ["fft", "midi"]
fft = ["dep:rustfft"]
midi = ["dep:rustysynth"]
napi = []
headless = []
windows_device = []

[dev-dependencies]
httpmock = "0.8.3"
tempfile = "3"

[lints]
workspace = true
