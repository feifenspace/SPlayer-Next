[package]
name = "headless-server"
version = "0.1.0"
edition = "2021"
description = "Linux headless HTTP/WebSocket server for SPlayer"

[[bin]]
name = "headless-server"
path = "src/main.rs"

[dependencies]
# 音频核心
audio-engine-core = { path = "../audio-engine-core" }

# HTTP 框架
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 配置
serde_yaml = "0.9"

# 数据库
rusqlite = { version = "0.32", features = ["bundled"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 在线音源与网络
ncm-api-rs = { path = "/home/songlian/ncm-api-rs", features = ["server"] }
reqwest = { version = "0.12", features = ["json", "stream"] }

# 工具
anyhow = "1"
parking_lot = "0.12"
futures-util = "0.3"
md5 = "0.7"
urlencoding = "2"

[dev-dependencies]
tokio-tungstenite = "0.24"
tempfile = "3"

[lints]
workspace = true
