[workspace]
# 独立 crate（自带空 workspace 表，脱离仓库根工作区）：
# 根 Cargo.toml 的 members 列表零改动，上游 merge 零冲突。
# 构建/测试：cargo test --manifest-path native/streaming-api/Cargo.toml

[package]
name = "streaming-api"
version = "0.1.0"
edition = "2021"
description = "Qobuz / TIDAL Hi-Res online API client for SPlayer-Next headless server (pure Rust, zero Node runtime)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
thiserror = "2"
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2"
tokio = { version = "1", features = ["time", "sync"] }
base64 = "0.22"
regex = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
