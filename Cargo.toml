[workspace]
members = [
  "./native/audio-engine",
  "./native/audio-engine-core",
  "./native/audio-capture",
  "./native/media-ctrl",
  "./native/taskbar-lyric",
  "./native/taskbar-thumbnail",
  "./native/headless-server",
  "./native/diretta-sys",
  "./native/opencc",
]
resolver = "3"
# qqkg-api 自带空 [workspace] 表的独立 crate（上游 members 列表零改动），
# headless-server 以路径依赖引用它，必须 exclude 防止 multi-root 冲突。
exclude = ["native/qqkg-api", "native/streaming-api"]

[workspace.dependencies]
napi = { version = "3.12.1" }
napi-derive = "3.6.3"
napi-build = "2.4.1"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }
tracing-appender = "0.2"
time = { version = "0.3", features = ["macros", "formatting"] }
tokio = { version = "1" }
windows = "0.62"
windows-core = "0.62.2"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
redundant_clone = "deny"
needless_collect = "warn"
large_enum_variant = "warn"
collapsible_if = "allow"
redundant_pattern_matching = "allow"

[profile.release]
lto = true
strip = "symbols"

